       Analytics (PostHog) — page views only.
       Traffic goes through the managed reverse proxy at
       n.isjuniehereyet.com, which serves both the library and the
       event endpoint, so ad blockers that filter posthog.com don't
       eat our visit counts. That subdomain is a CNAME to PostHog —
       if it ever stops resolving, analytics silently stop and the
       page itself is unaffected.

       POSTHOG_KEY is the public Project API key; it's write-only, so
       it's fine to have here in the open.
       ============================================================ -->
  <script>
    (function () {
      const POSTHOG_KEY = "phc_kCgEMLsjft79tmhbzvYKMjRFMy5aJUMRYsFmYf3xRr8a";
      const POSTHOG_HOST = "https://n.isjuniehereyet.com"; // managed reverse proxy

      // Not configured — skip quietly rather than erroring.
      if (!POSTHOG_KEY.startsWith("phc_")) return;

      const script = document.createElement("script");
      script.src = POSTHOG_HOST + "/static/array.js";
      script.async = true;
      script.onload = function () {
        posthog.init(POSTHOG_KEY, {
          api_host: POSTHOG_HOST,
          ui_host: "https://us.posthog.com", // so PostHog links point at the real app, not the proxy
          capture_pageview: true,      // the one thing we actually want
          autocapture: false,          // no click/input tracking
          capture_pageleave: false,    // no time-on-page events
          capture_performance: false,  // no web vitals or network timing
          disable_session_recording: true,

      document.head.appendChild(script);

  <style>
    :root {
      --bg: #fdf6f0;
      --fg: #2d2a26;
      /* Muted black & white scheme while the answer is still "No" */
      --bg-no: #efefef;
      --fg-no: #000;
      --answer-no: #1a1c21;
      --answer-yes: #3d9960;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1a18;
        --fg: #f5efe9;
        --bg-no: #222;
        --fg-no: #efefef;
        --answer-no: #e4e6eb;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--bg);
      color: var(--fg);
      padding: 1rem;
    }

    body.no {
      background: var(--bg-no);
      color: var(--fg-no);
    }

    h1 {
      font-size: clamp(1.25rem, 4vw, 2rem);
      font-weight: 500;
      opacity: 0.75;
      margin-bottom: 1rem;
    }

    #answer {
      font-size: clamp(6rem, 30vw, 18rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    #answer.no  { color: var(--answer-no); }
    #answer.yes { color: var(--answer-yes); }

    #detail {
      font-size: clamp(1rem, 3vw, 1.5rem);
      opacity: 0.75;
      margin-top: 1.5rem;
      min-height: 1.5em;
    }

    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ============================================================
       TO UPDATE THE SITE WHEN JUNIE ARRIVES:
       1. Change JUNIE_IS_HERE below from false to true.
       2. (Optional) Put her birth date in BIRTH_DETAIL.
       3. Save / commit / push. That's it!
       ============================================================ -->
  <script>
    const JUNIE_IS_HERE = false;
    const BIRTH_DETAIL = ""; // e.g. "Born August 14, 2026 · 7 lb 4 oz"
  </script>

  <canvas id="confetti"></canvas>
  <h1>Is Junie here yet?</h1>
  <div id="answer"></div>
  <p id="detail"></p>

  <script>
    // "?preview=yes" lets you preview the YES state without flipping the flag.
    const params = new URLSearchParams(location.search);
    const here = params.get("preview") === "yes" || JUNIE_IS_HERE;

    const answer = document.getElementById("answer");
    answer.textContent = here ? "YES!" : "Soon";
    answer.className = here ? "yes" : "no";
    document.body.className = here ? "yes" : "no";

    // Emoji favicon: hourglass while waiting, baby once she's here.
    const emojiIcon = (emoji) =>
      "data:image/svg+xml," +
      encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">${emoji}</text></svg>`
      );
    document.getElementById("favicon").href = emojiIcon(here ? "👼" : "⏳");
    if (here) {
      document.getElementById("detail").textContent =
        BIRTH_DETAIL || "She's finally here! 🎉";
    }

    if (here) startConfetti();

    function startConfetti() {
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");
      const colors = ["#3d9960", "#f2b134", "#e56b6f", "#5390d9", "#b298dc"];
      let pieces = [];

      function resize() {
        canvas.width = innerWidth;
        canvas.height = innerHeight;
      }
      resize();
      addEventListener("resize", resize);

      for (let i = 0; i < 120; i++) {
        pieces.push({
          x: Math.random() * innerWidth,
          y: Math.random() * -innerHeight,
          w: 6 + Math.random() * 6,
          h: 8 + Math.random() * 8,
          color: colors[i % colors.length],
          speed: 1.5 + Math.random() * 2.5,
          drift: Math.random() * 2 - 1,
          angle: Math.random() * Math.PI * 2,
          spin: Math.random() * 0.1 - 0.05,
        });
      }

      (function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const p of pieces) {
          p.y += p.speed;
          p.x += p.drift;
          p.angle += p.spin;
          if (p.y > canvas.height + 20) {
            p.y = -20;
            p.x = Math.random() * innerWidth;
          }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        requestAnimationFrame(draw);
      })();
    }
  </script>

</body>
</html>
