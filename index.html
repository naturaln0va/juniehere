<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Is Junie here yet?</title>
  <meta name="description" content="Has Junie been born yet? Find out here.">
  <meta property="og:title" content="Is Junie here yet?">
  <meta property="og:description" content="Has Junie been born yet? Find out here.">
  <meta property="og:url" content="https://isjuniehereyet.com">
  <meta property="og:image" content="https://isjuniehereyet.com/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link id="favicon" rel="icon" href="">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #fdf6f0;
      color: #2d2a26;
      padding: 1rem;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1c1a18;
        color: #f5efe9;
      }
    }

    /* Muted black & white scheme while the answer is still "No" */
    body.no {
      background: #efefef;
      color: #000;
    }

    @media (prefers-color-scheme: dark) {
      body.no {
        background: #000;
        color: #efefef;
      }
    }

    h1 {
      font-size: clamp(1.25rem, 4vw, 2rem);
      font-weight: 500;
      opacity: 0.75;
      margin-bottom: 1rem;
    }

    #answer {
      font-size: clamp(6rem, 30vw, 18rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    #answer.no  { color: #1A1C21; }
    #answer.yes { color: #3d9960; }

    #detail {
      font-size: clamp(1rem, 3vw, 1.5rem);
      opacity: 0.75;
      margin-top: 1.5rem;
      min-height: 1.5em;
    }

    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ============================================================
       TO UPDATE THE SITE WHEN JUNIE ARRIVES:
       1. Change JUNIE_IS_HERE below from false to true.
       2. (Optional) Put her birth date in BIRTH_DETAIL.
       3. Save / commit / push. That's it!
       ============================================================ -->
  <script>
    const JUNIE_IS_HERE = false;
    const BIRTH_DETAIL = ""; // e.g. "Born August 14, 2026 · 7 lb 4 oz"
  </script>

  <canvas id="confetti"></canvas>
  <h1>Is Junie here yet?</h1>
  <div id="answer"></div>
  <p id="detail"></p>

  <script>
    // "?preview=yes" lets you preview the YES state without flipping the flag.
    const params = new URLSearchParams(location.search);
    const here = params.get("preview") === "yes" || JUNIE_IS_HERE;

    const answer = document.getElementById("answer");
    answer.textContent = here ? "YES!" : "No";
    answer.className = here ? "yes" : "no";
    document.body.className = here ? "yes" : "no";

    // Emoji favicon: hourglass while waiting, baby once she's here.
    const emojiIcon = (emoji) =>
      "data:image/svg+xml," +
      encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">${emoji}</text></svg>`
      );
    document.getElementById("favicon").href = emojiIcon(here ? "👼" : "⏳");
    if (here) {
      document.getElementById("detail").textContent =
        BIRTH_DETAIL || "She's finally here! 🎉";
    }

    if (here) startConfetti();

    function startConfetti() {
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");
      const colors = ["#3d9960", "#f2b134", "#e56b6f", "#5390d9", "#b298dc"];
      let pieces = [];

      function resize() {
        canvas.width = innerWidth;
        canvas.height = innerHeight;
      }
      resize();
      addEventListener("resize", resize);

      for (let i = 0; i < 120; i++) {
        pieces.push({
          x: Math.random() * innerWidth,
          y: Math.random() * -innerHeight,
          w: 6 + Math.random() * 6,
          h: 8 + Math.random() * 8,
          color: colors[i % colors.length],
          speed: 1.5 + Math.random() * 2.5,
          drift: Math.random() * 2 - 1,
          angle: Math.random() * Math.PI * 2,
          spin: Math.random() * 0.1 - 0.05,
        });
      }

      (function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const p of pieces) {
          p.y += p.speed;
          p.x += p.drift;
          p.angle += p.spin;
          if (p.y > canvas.height + 20) {
            p.y = -20;
            p.x = Math.random() * innerWidth;
          }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        requestAnimationFrame(draw);
      })();
    }
  </script>

</body>
</html>
